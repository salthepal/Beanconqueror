services:
  beanconqueror:
    build:
      context: .
      dockerfile: Dockerfile
    image: beanconqueror:local
    ports:
      - '${HOST_PORT:-8080}:8080'
    environment:
      NODE_ENV: '${NODE_ENV:-production}'
      API_BASE_URL: '${API_BASE_URL:-/api}'
      API_CLIENT_TOKEN: '${API_CLIENT_TOKEN}'
      SESSION_SIGNING_SECRET: '${SESSION_SIGNING_SECRET}'
      DB_HOST: '${DB_HOST:-mariadb}'
      DB_PORT: '${DB_PORT:-3306}'
      DB_NAME: '${DB_NAME}'
      DB_USER: '${DB_USER}'
      DB_PASSWORD: '${DB_PASSWORD}'
      MARIADB_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD}'
      GAGGIUINO_BASE_URL: '${GAGGIUINO_BASE_URL:-http://gaggiuino.local}'
      GAGGIUINO_AUTOSYNC_ENABLED: '${GAGGIUINO_AUTOSYNC_ENABLED:-true}'
      GAGGIUINO_AUTOSYNC_INTERVAL_MS: '${GAGGIUINO_AUTOSYNC_INTERVAL_MS:-30000}'
      GAGGIUINO_AUTOSYNC_MAX_BACKOFF_MS: '${GAGGIUINO_AUTOSYNC_MAX_BACKOFF_MS:-300000}'
      GAGGIUINO_AUTOSYNC_BATCH_SIZE: '${GAGGIUINO_AUTOSYNC_BATCH_SIZE:-10}'
      GAGGIUINO_AUTOSYNC_INITIAL_IMPORT_COUNT: '${GAGGIUINO_AUTOSYNC_INITIAL_IMPORT_COUNT:-6}'
      FEATURE_FLAGS_JSON: '${FEATURE_FLAGS_JSON:-{"brewSharing":true,"betaFlow":false}}'
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: '${DB_NAME}'
      MARIADB_USER: '${DB_USER}'
      MARIADB_PASSWORD: '${DB_PASSWORD}'
      MARIADB_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD}'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  mariadb-data:
