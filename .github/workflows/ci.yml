name: CI

on:
  push:
    branches: ['develop', 'main', 'master']
  pull_request:
  workflow_dispatch:

jobs:
  app-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test
      - name: Frontend dependency audit
        run: pnpm audit --audit-level high

  api-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API deps
        run: npm ci
      - name: API unit tests
        run: npm test
      - name: API dependency audit
        run: npm audit --omit=dev --audit-level=high

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t beanconqueror:ci .
      - name: Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image --severity HIGH,CRITICAL --exit-code 1 beanconqueror:ci

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Session/auth + storage import smoke
        run: |
          curl -fsS http://localhost:8080/api/status -H "X-Beanconqueror-Client-Token: dev-client-token" >/tmp/status.json
          curl -fsS -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8080/api/storage/import \
            -H "X-Beanconqueror-Client-Token: dev-client-token" \
            -H "Content-Type: application/json" \
            --data '{"smoke":"ci","ts":1700000000}' | grep -E "204|200"
      - name: AI run-now smoke
        run: |
          curl -fsS -X POST http://localhost:8080/api/ai-analysis/run-now \
            -H "X-Beanconqueror-Client-Token: dev-client-token" \
            -H "Content-Type: application/json" \
            --data '{}'
      - name: Gaggiuino sync-now smoke (non-blocking)
        run: |
          set +e
          code=$(curl -s -o /tmp/gaggi.json -w "%{http_code}" \
            -X POST http://localhost:8080/api/gaggiuino/autosync-sync-now \
            -H "X-Beanconqueror-Client-Token: dev-client-token" \
            -H "Content-Type: application/json" \
            --data '{}')
          cat /tmp/gaggi.json
          if [ "$code" = "200" ] || [ "$code" = "503" ]; then
            exit 0
          fi
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
